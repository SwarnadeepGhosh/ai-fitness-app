# Naming Server
eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/registry/eureka

# Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs.html
#    operationsSorter: method
# Swagger path: http://localhost:8080/docs.html or http://localhost:8080/swagger-ui/index.html

# OpenTelemetry Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0  # 100% sampling for demo
  otlp:
    # tracing:
    #   endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    metrics:
      export:
        enabled: true
        url: ${API_HOST}/observe/api/default/v1/metrics
        step: 30s     # export interval
        headers:
          Authorization: "Basic ${OTEL_EXPORTER_OTLP_AUTH_TOKEN}"
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${API_HOST}/observe/api/default/v1/traces
          headers:
            Authorization: "Basic ${OTEL_EXPORTER_OTLP_AUTH_TOKEN}"
    logging:
      export:
        otlp:
          endpoint: ${API_HOST}/observe/api/default/v1/logs
          headers:
            Authorization: "Basic ${OTEL_EXPORTER_OTLP_AUTH_TOKEN}"


