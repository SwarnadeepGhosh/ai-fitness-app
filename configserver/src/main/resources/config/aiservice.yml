server:
  port: 8084
  servlet:
    context-path: /api/recommendations

spring:
  mongodb:
    uri: "mongodb+srv://swarnadeep:${MONGODB_PASSWORD}@swarnadeep.lx7vex8.mongodb.net/aifitnessrecommendation?retryWrites=true&w=majority"
    database: aifitnessrecommendation
    auto-index-creation: true

  kafka:
    # bootstrap-servers: localhost:9092
    bootstrap-servers: pkc-l7pr2.ap-south-1.aws.confluent.cloud:9092
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username='CUUOKL3RGKJVNKOV' password='${KAFKA_PASSWORD}';
      session.timeout.ms: 45000
      client.id: ccloud-springboot-client-1912bc0e-dc67-49f8-812c-786705966c96
    #    producer:
    #      key-serializer: org.apache.kafka.common.serialization.StringSerializer
    #      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: aifitness-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      #      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.sg.fitness.aiservice.model.Activity

kafka-topic: ai-fitness
gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
    key: ${GEMINI_API_KEY}

# Naming Server
